# =============================================================================
# SUNO-PERCEPTIBLE MUSIC THEORY TAGS
#
# These ARE evaluated at runtime by scripts/theory_triggers.py. Each entry fires
# only when its evidence exists. `trigger` strings are matched against the real
# measured evidence, never used as a substring guess.
# =============================================================================
theory_tags:
  progressions:
    - tag: "2-5-1 jazz progression"
      trigger: ["ii-V-I", "ii7-V7-Imaj7"]
      evidence: "roman_loop"
      note: "Standard jazz and neo-soul cadence"
    - tag: "four-chord pop loop"
      trigger: ["i-VI-III-VII", "I-V-vi-IV", "vi-IV-I-V"]
      evidence: "roman_loop"
      note: "Most common radio pop / ballad loop"
    - tag: "andalusian cadence"
      trigger: ["i-VII-VI-V", "iv6-V7"]
      evidence: "roman_loop"
      note: "Flamenco, acoustic rock, emotional tension"
    - tag: "blues progression"
      trigger: ["I-IV-V blues", "12-bar blues"]
      evidence: "roman_loop"
      note: "Classic blues, funk, rock"

  modes_and_scales:
    - tag: "dorian mode"
      trigger: ["Dorian", "minor with natural 6th"]
      evidence: "modal_flavor"
      note: "Warm minor, funk, jazz fusion"
    - tag: "mixolydian groove"
      trigger: ["Mixolydian", "major with flat 7th"]
      evidence: "modal_flavor"
      note: "Blues rock, southern rock, jam band"
    - tag: "minor pentatonic"
      trigger: ["pentatonic minor", "blues scale"]
      evidence: "pentatonic == 'minor'"
      note: "Rock, trap melodies, soul hooks"
    - tag: "major pentatonic"
      trigger: ["pentatonic major"]
      evidence: "pentatonic == 'major'"
      note: "Mandopop, country, folk"
    - tag: "phrygian tension"
      trigger: ["Phrygian", "minor with flat 2nd"]
      evidence: "modal_evidence.b2 >= 0.35 AND b2 > natural_2 * 1.10"
      note: "Dark electronic, trap, metal. Requires a MEASURED flat 2nd; natural minor is Aeolian."

  rhythm_and_groove:
    - tag: "syncopated bass"
      trigger: ["syncopation > 0.4"]
      evidence: "bass_syncopation_ratio > 0.4 (bass line only)"
    - tag: "half-time drum beat"
      trigger: ["half-time", "downtempo trap"]
      evidence: "half_time is True"
    - tag: "straight 16ths"
      trigger: ["16th notes", "motorik beat"]
      evidence: "swing_ratio in [0.9, 1.1] AND sixteenth_hats is True"
    - tag: "swung 8ths"
      trigger: ["swing ratio > 1.2"]
      evidence: "swing_ratio >= 1.2"
    - tag: "polyrhythm 3:4"
      trigger: ["metric modulation", "polyrhythm"]
      evidence: "polyrhythm is True"

