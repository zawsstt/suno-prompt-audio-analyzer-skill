# Suno AI Style Tag Library v2.0
# Generated for audio-analyzer skill v7.3
#
# v7.3 NOTE — read this before adding tags
# ----------------------------------------
# `theory_tags` is now ACTUALLY EVALUATED. In v7.2 this block was documented but
# no script ever read it; the compiler emitted theory tags from a guess chain,
# which is how ordinary minor songs ended up tagged "phrygian tension".
#
# The contract in v7.3:
#   * every tag fires only when a named evidence key is present AND satisfies
#     its condition (see scripts/theory_triggers.py)
#   * a missing measurement means "do not emit", never "emit the default"
#   * "phrygian tension" additionally requires a measured flat 2nd that beats
#     the natural 2nd; natural minor (b6 + b7) resolves to Aeolian
#   * "syncopated bass" is measured on the BASS line only
#
# `genre_emission_contract` below lists the exact genre strings the compiler can
# emit. auto_exclusion_map.yaml matches against those strings, so if you add a
# genre here you must add it there too.

